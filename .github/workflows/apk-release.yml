name: APK release

# Reproducible Android preview build published as a GitHub Release.
# Secrets: EXPO_TOKEN (repo secret) and github.token (generated by Actions).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write # required to create the GitHub Release and upload assets

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "Release tag must start with 'v' (got: $TAG)" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK with EAS
        id: build
        working-directory: apps/mobile
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000' }}
        run: |
          set -euo pipefail
          # We wait for completion: the workflow needs the finished artifact.
          # --json writes only the result document to stdout; progress goes to stderr.
          eas build --platform android --profile preview --non-interactive --json \
            > "$RUNNER_TEMP/eas-build.json"

          APK_URL=$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8").trim());
            const build = Array.isArray(data) ? data[0] : data;
            const url = build?.artifacts?.buildUrl;
            if (!url) {
              console.error("EAS build returned no APK artifact URL");
              process.exit(1);
            }
            process.stdout.write(url);
          ' "$RUNNER_TEMP/eas-build.json")

          APK_NAME="aahaarloop-${RELEASE_TAG}.apk"
          APK_PATH="$RUNNER_TEMP/$APK_NAME"
          curl -fL --retry 3 "$APK_URL" -o "$APK_PATH"
          test -s "$APK_PATH"

          CHECKSUM=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "$CHECKSUM  $APK_NAME" > "$APK_PATH.sha256"
          echo "$CHECKSUM  $APK_PATH" | sha256sum -c -

          echo "artifact_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Generate release and install notes
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_APK: ${{ steps.build.outputs.apk_name }}
          RELEASE_CHECKSUM: ${{ steps.build.outputs.checksum }}
          RELEASE_BUILD_URL: ${{ steps.build.outputs.artifact_url }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000' }}
        run: node scripts/release-notes.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aahaarloop Android APK ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.apk_path }}.sha256
            INSTALL.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
