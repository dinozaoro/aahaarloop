<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#063a2a" />
    <title>You are offline · AahaarLoop</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffbed;
        color: #063a2a;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 28px;
        line-height: 1.6;
        color: #1d6b4a;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: #063a2a;
        color: #fffbed;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #a05f32;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>You are offline</h1>
      <p>
        Your saved donations and claims are still available. Reconnect to sync
        your latest changes.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
